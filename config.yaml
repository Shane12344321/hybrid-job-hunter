# All tenants/hosts/sites live-verified via a real CXS POST on 2026-07-07
# (endpoint returned jobPostings). Location filtering is client-side on
# locationsText; include_multi_location turns on the "N Locations" inclusion rule so
# multi-location intern postings aren't silently dropped.
- name: NVIDIA
  ats: workday
  tenant: nvidia
  wd_host: wd5
  site: NVIDIAExternalCareerSite
  include_multi_location: true
  # Default "intern" fuzzy-matches internal/international here: total=901, far
  # past any page budget. "internship" returns 23 and, verified 2026-08-02
  # against a full 901-posting read, finds exactly the same India roles.
  search: internship
  max_pages: 4
- name: Citi
  ats: workday
  tenant: citi
  wd_host: wd5
  site: "2"  # site is literally "2"
  include_multi_location: true
  # Default "intern" returns total=2000 — Workday's response cap, so the true
  # set is unreadable at any page budget. "internship" returns 51 and, verified
  # 2026-08-02 against a full 2000-posting read, misses no India role.
  search: internship
  max_pages: 4
- name: BlackRock
  ats: workday
  tenant: blackrock
  wd_host: wd1
  site: BlackRock_Professional  # India (Gurgaon/Mumbai) roles
  include_multi_location: true
  # "intern" also matches internal/international here: total=164 as of
  # 2026-08-02 and growing, and Workday caps limit at 20 per page.
  max_pages: 10
- name: Adobe
  ats: workday
  tenant: adobe
  wd_host: wd5
