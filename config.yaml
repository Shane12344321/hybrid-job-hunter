custom_pages:
# The old greenhouse:linkedin slug is "LI Test Company", not LinkedIn. Track
# LinkedIn's official India engineering-internship program page instead. It is
# a landing page rather than a stable job-card board, so alert only after a
# reproducible change within its stable #main content section.
- name: LinkedIn
  url: https://careers.linkedin.com/pathways-programs/internships/india-eng-internships
  css_selector: '#main'
  keyword_filter: false
  location_filter: false
# - name: Citadel
#   url: https://www.citadel.com/careers/open-opportunities/
#   keyword_filter: true
# - name: Morgan Stanley
#   url: https://morganstanley.tal.net/vx/lang-en-GB/mobile-0/brand-2/candidate/jobboard/vacancy/1/adv/
#   keyword_filter: true
# - name: Two Sigma
#   url: https://www.twosigma.com/careers/
#   keyword_filter: true
# - name: Optiver
#   url: https://optiver.com/working-at-optiver/career-opportunities/
#   keyword_filter: true
# NOTE: Amazon and NVIDIA are now hunted via native API adapters above
# (ats: amazon / ats: workday) — no Playwright scraping needed. Apple stays a
# Playwright candidate: its
# jobs.apple.com search API is CSRF-gated and the /api/role/search path 404s
# unauthenticated, so no native adapter ships for it.
# - name: Apple
#   url: https://jobs.apple.com/en-in/search?sort=relevance&search=intern&location=india-IND
#   keyword_filter: true
- name: Atlassian Early Careers (fallback)
  fallback_for: Atlassian
  url: https://www.atlassian.com/company/careers/earlycareers
  css_selector: main
  # This is a labelled availability fallback, so any substantive page change
  # in the main content is useful even when it omits the literal word "intern".
  keyword_filter: false
  location_filter: false
- name: Goldman Sachs Summer Analyst India
  supplement_for: Goldman Sachs Engineering
  url: https://www.goldmansachs.com/careers/students/programs-and-internships/india/summer-analyst-program
  keyword_filter: true
  location_filter: false
- name: D. E. Shaw India Internships (program monitor)
  supplement_for: D. E. Shaw
  url: https://www.deshawindia.com/careers/internships
  # Parsed per job rather than hashed. This page renders the full positions
  # list (95 cards, 37,914 chars), so a whole-page hash fired a generic
  # "changes detected" alert every time any senior role was added or removed —
  # measured drifting within ~20 minutes on 2026-08-03. Job-level parsing dedups
  # per posting, so a new India internship alerts once, with its title and link.
  # `parent-arrow-long` is the same stable class hunt_deshaw uses on
  # deshaw.com; the styled-components classes here are build-generated and
  # would break on redeploy, so don't scope by those.
  job_selector: a.parent-arrow-long[href*='/careers/']
  id_regex: -(\d+)$
  keyword_filter: true
  location_filter: false  # the domain is India-only, cards carry no location
- name: Daksh Trading
  url: https://www.dakshtrading.com/careers
  # Google Sites page: hash only the careers/openings block so company-trip
  # gallery edits do not create job alerts.
  css_selector: '.tyJCtd ul:has(a)'
  keyword_filter: true
  # Daksh is based in Hong Kong, but its quant internships are relevant even
  # when the page does not mention one of the globally configured India cities.
  location_filter: false
- name: Anthropic Claude Campus (program monitor)
  supplement_for: Anthropic
  url: https://claude.com/programs/campus
  # Program landing page (not a job board). Spring 2026 applications are
  # closed; a change here — a new cohort opening, an intern/campus role going
  # live — should fire an alert.
  # Scoped to <main>: the whole body is 15,609 chars of which only 2,033 are
  # the programme content, and hashing nav/footer/cookie chrome turns every
  # unrelated site tweak into a "changes detected" alert (measured 2026-08-03).
  css_selector: main
  keyword_filter: false
  location_filter: false
