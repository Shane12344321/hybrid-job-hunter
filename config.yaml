keywords:
- intern
- internship
- summer
- new grad
# Word-boundary matching means each surface form needs its own entry:
# "new grad" does not match "New Graduate", nor "apprentice" "Apprenticeship".
# Google's India early-career programme is named Apprenticeship, so without
# these its roles were fetched and then silently dropped. Verified against
# 17,089 live postings on 2026-08-02: these add no noise.
- new graduate
- apprentice
- apprenticeship

# Titles matching any of these are REJECTED even when a keyword matches.
# Word-boundary matching, case-insensitive. Edit freely.
exclude_keywords:
- mba
- phd
- "2025"            # stale season postings
- skillbridge       # US military transition program (not eligible)
- copy writer       # non-tech internships (noise from Groww etc.)
- graphic designer
- video editor

locations:
- india
- bangalore
- bengaluru
- hyderabad
- pune
- gurugram
- gurgaon
- noida
- delhi
- mumbai
- chennai
- remote

# "remote" above has to stay so remote India roles are caught, but on its own it
# also admits "Remote - USA". Anything naming one of these is dropped even if it
# says remote. Matched on word boundaries, so "us" won't hit "Uttar Pradesh".
exclude_locations:
- usa
- u.s.
- united states
- canada
- emea
- uk
- united kingdom
- ireland
- germany
- poland
- mexico
- brazil
- singapore
- australia
- japan
- china
# Measured across the full 370-source dry run on 2026-08-08: these drop only
# two foreign "remote" false positives (Cribl/San Francisco and UiPath/Warsaw).
- san francisco
- warsaw

telegram:
  # Do not put actual tokens here; use environment variables or GitHub secrets
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}

