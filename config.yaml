# (ats: amazon / ats: workday) — no Playwright scraping needed. Apple stays a
# Playwright candidate: its
# jobs.apple.com search API is CSRF-gated and the /api/role/search path 404s
# unauthenticated, so no native adapter ships for it.
# - name: Apple
#   url: https://jobs.apple.com/en-in/search?sort=relevance&search=intern&location=india-IND
#   keyword_filter: true
- name: Atlassian Early Careers (fallback)
  fallback_for: Atlassian
  url: https://www.atlassian.com/company/careers/earlycareers
  css_selector: main
  # This is a labelled availability fallback, so any substantive page change
  # in the main content is useful even when it omits the literal word "intern".
  keyword_filter: false
  location_filter: false
- name: Goldman Sachs Summer Analyst India
  supplement_for: Goldman Sachs Engineering
  url: https://www.goldmansachs.com/careers/students/programs-and-internships/india/summer-analyst-program
  keyword_filter: true
  location_filter: false
- name: D. E. Shaw India Internships (program monitor)
  supplement_for: D. E. Shaw
  url: https://www.deshawindia.com/careers/internships
  keyword_filter: true
  location_filter: false
- name: Daksh Trading
  url: https://www.dakshtrading.com/careers
  # Google Sites page: hash only the careers/openings block so company-trip
  # gallery edits do not create job alerts.
  css_selector: '.tyJCtd ul:has(a)'
  keyword_filter: true
  # Daksh is based in Hong Kong, but its quant internships are relevant even
  # when the page does not mention one of the globally configured India cities.
  location_filter: false
- name: Anthropic Claude Campus (program monitor)
  supplement_for: Anthropic
  url: https://claude.com/programs/campus
  # Program landing page (not a job board). Spring 2026 applications are
  # closed; hash the whole page so any substantive change — e.g. a new cohort
  # opening or an intern/campus role going live — fires a change alert.
  keyword_filter: false
  location_filter: false
