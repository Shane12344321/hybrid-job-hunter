keywords:
- intern
- internship
- summer
- new grad

# Titles matching any of these are REJECTED even when a keyword matches.
# Word-boundary matching, case-insensitive. Edit freely.
exclude_keywords:
- mba
- phd
- "2025"            # stale season postings
- skillbridge       # US military transition program (not eligible)
- copy writer       # non-tech internships (noise from Groww etc.)
- graphic designer
- video editor

locations:
- bangalore
- bengaluru
- hyderabad
- pune
- gurugram
- gurgaon
- noida
- delhi
- mumbai
- chennai
- remote

telegram:
  # Do not put actual tokens here; use environment variables or GitHub secrets
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}

